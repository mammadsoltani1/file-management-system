services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filehub-api
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - filehub_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: filehub-postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - filehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  filehub_postgres_data:
  filehub_uploads: